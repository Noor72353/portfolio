<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex"
    >

    <title>
        Page Not Found | Noorwali Khan
    </title>

    <link
        rel="icon"
        type="image/png"
        href="assets/images/favicon.png?v=5"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .error-page {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

            text-align: center;

        }


        .error-content {

            max-width: 650px;

            padding: 50px 35px;

            border-radius: 20px;

            background:
                rgba(255, 255, 255, 0.85);

            box-shadow:
                0 20px 50px
                rgba(15, 23, 42, 0.10);

        }


        .error-code {

            margin-bottom: 10px;

            font-size: clamp(
                80px,
                15vw,
                140px
            );

            line-height: 1;

            font-weight: 800;

            color: #2563eb;

            letter-spacing: -5px;

        }


        .error-content h1 {

            margin-bottom: 15px;

            font-size: 30px;

            color: #1e293b;

        }


        .error-content p {

            margin-bottom: 28px;

            color: #64748b;

            font-size: 16px;

            line-height: 1.8;

        }


        .error-content a {

            display: inline-block;

            padding: 13px 24px;

            border-radius: 9px;

            background: #2563eb;

            color: #ffffff;

            font-weight: 700;

            text-decoration: none;

            transition:
                background 0.3s ease,
                transform 0.3s ease;

        }


        .error-content a:hover {

            background: #1d4ed8;

            transform:
                translateY(-2px);

        }

    </style>

</head>


<body>

    <main class="error-page">

        <div class="error-content">

            <div class="error-code">

                404

            </div>


            <h1>

                Page Not Found

            </h1>


            <p>

                The page you are looking for
                doesn't exist or may have been moved.

            </p>


            <a
                href="index.html"
                class="back-home"
            >

                Return to Portfolio

            </a>

        </div>

    </main>

</body>

</html>
